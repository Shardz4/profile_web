<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <meta name="color-scheme" content="only dark" />
    <title>Arnav Sharma | Systems Architect Portfolio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link data-trunk rel="css" href="style.css" />
    <link data-trunk rel="rust" href="Cargo.toml" />
</head>
<body>
    <div id="terminal-container"></div>
    <div id="boot-overlay">
        <div class="overlay-content">
            <div class="system-status">
                <div class="status-line"><span class="prompt">▸</span> SYSTEM: ARNAV_SHARMA_PORTFOLIO v1.0.0</div>
                <div class="status-line"><span class="prompt">▸</span> CONNECTION: SECURE (WASM/RATZILLA)</div>
                <div class="status-line"><span class="prompt">▸</span> STATUS: READY TO BOOT</div>
            </div>
            <button id="launch-btn">[ BOOT SYSTEM ]</button>
            <div class="fullscreen-note">Click to initialize terminal emulator in full screen mode</div>
        </div>
    </div>
</body>
</html>
