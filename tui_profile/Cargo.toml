[package]
name = "tui_profile"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "tui_profile"
path = "src/main.rs"

[dependencies]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
crossterm = "0.27.0"
ratatui = "0.30.0"

[target.'cfg(target_arch = "wasm32")'.dependencies]
ratzilla = "0.3.0"
wasm-bindgen = "0.2"
web-time = "1.1.0"
console_error_panic_hook = "0.1.7"
web-sys = { version = "0.3", features = ["HtmlCanvasElement", "Window", "Document", "Element"] }